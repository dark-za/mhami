# Production NGINX for the SPA + API reverse proxy.
#
# TLS is terminated here. In production, provision certificates (e.g. via
# certbot/ACME) and mount them into the container at /etc/nginx/certs so that
# fullchain.pem and privkey.pem are present. Without valid certificates the
# 443 server block cannot start, so certificates MUST be provisioned before
# relying on HTTPS. The 80 server redirects browser traffic to HTTPS and still
# proxies /api so non-browser clients are not hard-broken before redirect.
#
# Security headers below are the canonical set defined in
# infra/nginx/security-headers.conf and are carried inline here because the
# frontend image builds from the ./frontend context (that file is not in
# context). Keep both in sync.

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # INFRA-02: enforcing CSP for the static SPA. The platform's frontend
    # bundle is a pure Vite build with no inline scripts, so a strict
    # ``script-src 'self'`` is safe to enforce from day one. The
    # Report-Only twin is also added here so any future inline-injection
    # regression is caught by the collector instead of breaking the user.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri ${CSP_REPORT_URI}" always;

    # Allow ACME http-01 challenges to reach the certbot webroot without a
    # redirect. Mount the webroot at /var/www/certbot in production.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy API traffic on port 80 as well, tagging the forwarded scheme so the
    # backend knows the original request was http.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 12m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri ${CSP_REPORT_URI}" always;

    # Certificates must be provisioned (e.g. via certbot/ACME) and mounted into
    # the container at /etc/nginx/certs.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
