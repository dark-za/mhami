[project]
name = "mhami-backend"
version = "0.1.0"
description = "Backend foundation for the Mhami operations platform"
requires-python = ">=3.13"

dependencies = [
  "Django==5.2.17",
  "djangorestframework==3.18.0",
  "psycopg[binary]==3.2.10",
  "celery==5.6.0",
  "redis==6.4.0",
  "gunicorn==23.0.0",
  "pydantic==2.10.0",
  "pydantic-settings==2.6.0",
  "structlog==24.4.0",
  "Pillow==12.3.0",
  "python-magic==0.4.27",
  "imagehash==4.3.1",
  "openai==1.60.0",
  "pytest==9.0.3",
  "pytest-django==4.11.0",
  "pytest-cov==6.0.0",
  "factory-boy==3.3.1",
  "freezegun==1.5.1",
  "ruff==0.8.0",
  "mypy==1.13.0",
  "drf-spectacular==0.28.0",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
  "bandit==1.7.10",
  "safety==3.2.0",
  "pip-audit==2.7.3",
]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

# QA-02: Coverage thresholds. ``fail_under`` is a soft gate — the
# current test suite is at ~70% line coverage and the team is closing
# the gap. The value is set to 70 today and raised as coverage
# instrumentation expands. ``omit`` skips generated and test code.
[tool.coverage.run]
source = ["apps"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/admin.py",
  "*/asgi.py",
  "*/wsgi.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if settings.DEBUG:",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]
