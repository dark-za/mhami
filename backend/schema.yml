components:
  schemas:
    AIAnalysisCriterion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        version_number:
          type: integer
          maximum: 2147483647
          minimum: 0
        title:
          type: string
          maxLength: 255
        criteria_json: {}
        reference_media_names: {}
        shadow_mode:
          type: boolean
        auto_pass_enabled:
          type: boolean
        auto_pass_risk_threshold:
          type: integer
          maximum: 32767
          minimum: 0
        active:
          type: boolean
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - created_by
      - id
      - title
      - version_number
    AIAnalysisCriterionCreate:
      type: object
      properties:
        title:
          type: string
        criteria_json: {}
        reference_media_names:
          type: array
          items:
            type: string
        shadow_mode:
          type: boolean
          default: true
        auto_pass_enabled:
          type: boolean
          default: false
        auto_pass_risk_threshold:
          type: integer
          maximum: 100
          minimum: 1
      required:
      - title
    AIAnalysisRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        branch:
          type: string
          format: uuid
        evidence_item:
          type: string
          format: uuid
          nullable: true
        provider_name:
          type: string
          maxLength: 64
        model_name:
          type: string
          maxLength: 128
        prompt_version:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/AIAnalysisRunStatusEnum'
        shadow_mode:
          type: boolean
        auto_pass_eligible:
          type: boolean
        auto_pass_activated:
          type: boolean
        risk_level:
          type: string
          maxLength: 32
        provider_payload: {}
        provider_result: {}
        human_decision:
          type: string
          maxLength: 32
        agreement_with_human:
          type: boolean
          nullable: true
        review_decision:
          type: string
          format: uuid
          nullable: true
        error_message:
          type: string
          maxLength: 255
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - company
      - created_at
      - created_by
      - id
      - provider_name
    AIAnalysisRunCreate:
      type: object
      properties:
        evidence_item_id:
          type: string
          format: uuid
        criterion_id:
          type: string
          format: uuid
      required:
      - evidence_item_id
    AIAnalysisRunStatusEnum:
      enum:
      - completed
      - needs_review
      - failed
      type: string
      description: |-
        * `completed` - Completed
        * `needs_review` - Needs Review
        * `failed` - Failed
    AIProviderConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        provider_name:
          type: string
          maxLength: 64
        endpoint_url:
          type: string
          maxLength: 255
        model_name:
          type: string
          maxLength: 128
        credential_reference:
          type: string
          maxLength: 255
        monthly_token_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
        monthly_cost_limit:
          type: string
