components:
  schemas:
    AIAnalysisCriterion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        version_number:
          type: integer
          maximum: 2147483647
          minimum: 0
        title:
          type: string
          maxLength: 255
        criteria_json: {}
        reference_media_names: {}
        shadow_mode:
          type: boolean
        auto_pass_enabled:
          type: boolean
        auto_pass_risk_threshold:
          type: integer
          maximum: 32767
          minimum: 0
        active:
          type: boolean
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - created_by
      - id
      - title
      - version_number
    AIAnalysisCriterionCreate:
      type: object
      properties:
        title:
          type: string
        criteria_json: {}
        reference_media_names:
          type: array
          items:
            type: string
        shadow_mode:
          type: boolean
          default: true
        auto_pass_enabled:
          type: boolean
          default: false
        auto_pass_risk_threshold:
          type: integer
          maximum: 100
          minimum: 1
      required:
      - title
    AIAnalysisRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        branch:
          type: string
          format: uuid
        evidence_item:
          type: string
          format: uuid
          nullable: true
        provider_name:
          type: string
          maxLength: 64
        model_name:
          type: string
          maxLength: 128
        prompt_version:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/AIAnalysisRunStatusEnum'
        shadow_mode:
          type: boolean
        auto_pass_eligible:
          type: boolean
        auto_pass_activated:
          type: boolean
        risk_level:
          type: string
          maxLength: 32
        provider_payload: {}
        provider_result: {}
        human_decision:
          type: string
          maxLength: 32
        agreement_with_human:
          type: boolean
          nullable: true
        review_decision:
          type: string
          format: uuid
          nullable: true
        error_message:
          type: string
          maxLength: 255
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - company
      - created_at
      - created_by
      - id
      - provider_name
    AIAnalysisRunCreate:
      type: object
      properties:
        evidence_item_id:
          type: string
          format: uuid
        criterion_id:
          type: string
          format: uuid
      required:
      - evidence_item_id
    AIAnalysisRunStatusEnum:
      enum:
      - completed
      - needs_review
      - failed
      type: string
      description: |-
        * `completed` - Completed
        * `needs_review` - Needs Review
        * `failed` - Failed
    AIProviderConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        provider_name:
          type: string
          maxLength: 64
        endpoint_url:
          type: string
          maxLength: 255
        model_name:
          type: string
          maxLength: 128
        credential_reference:
          type: string
          maxLength: 255
        monthly_token_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
        monthly_cost_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        enabled:
          type: boolean
        updated_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - id
      - updated_at
    AcceptanceCreate:
      type: object
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        document_version:
          type: string
          maxLength: 64
      required:
      - document_type
      - document_version
    AgentActionLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        grant:
          type: string
          format: uuid
        company:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        tool_name:
          type: string
          maxLength: 160
        required_scope:
          type: string
          maxLength: 96
        idempotency_key:
          type: string
          maxLength: 160
        arguments_hash:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/AgentActionLogStatusEnum'
        result: {}
        error_code:
          type: string
          maxLength: 96
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - arguments_hash
      - company
      - created_at
      - grant
      - id
      - idempotency_key
      - request_id
      - required_scope
      - tool_name
      - updated_at
    AgentActionLogList:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AgentActionLog'
      required:
      - logs
    AgentActionLogStatusEnum:
      enum:
      - received
      - executed
      - rejected
      - failed
      type: string
      description: |-
        * `received` - Received
        * `executed` - Executed
        * `rejected` - Rejected
        * `failed` - Failed
    AgentGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
        client_name:
          type: string
          maxLength: 160
        client_fingerprint:
          type: string
          readOnly: true
        scopes: {}
        status:
          $ref: '#/components/schemas/AgentGrantStatusEnum'
        active:
          type: boolean
          readOnly: true
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - client_fingerprint
      - client_name
      - company
      - created_at
      - expires_at
      - id
      - updated_at
      - user
    AgentGrantCreate:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        client_name:
          type: string
          maxLength: 160
        client_fingerprint:
          type: string
          maxLength: 128
          pattern: ^sha256:[0-9a-fA-F]{64}$
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
        expires_at:
          type: string
          format: date-time
      required:
      - client_fingerprint
      - client_name
      - expires_at
      - scopes
      - user_id
    AgentGrantCreateResponse:
      type: object
      description: Grant metadata plus the one-time secret returned only at issuance.
      properties:
        id:
          type: string
          format: uuid
