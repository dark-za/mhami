          format: date-time
          readOnly: true
      required:
      - company
      - connector_version
      - created_at
      - created_by
      - id
      - updated_at
    TenantConnectorEnrollmentStatusEnum:
      enum:
      - pending
      - active
      - revoked
      - outdated
      type: string
      description: |-
        * `pending` - Pending
        * `active` - Active
        * `revoked` - Revoked
        * `outdated` - Outdated
    TenantConnectorRevoke:
      type: object
      properties:
        reason:
          type: string
    WeeklyShift:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
        weekday:
          type: integer
          maximum: 32767
          minimum: 0
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        active:
          type: boolean
      required:
      - branch
      - end_time
      - id
      - start_time
      - user
      - weekday
    WeeklyShiftCreate:
      type: object
      description: |-
        Validate the inputs to ``POST /organizations/weekly-shifts``.

        C-03 closed an IDOR (A01:2021 Broken Access Control) where
        ``WeeklyShiftCreateSerializer`` accepted arbitrary ``branch_id`` and
        ``user_id`` UUIDs from the request body and the view would create a
        :class:`WeeklyShift` carrying cross-tenant references. The serializer
        now requires an explicit ``company`` to scope the lookup, asserts both
        foreign keys belong to that company, verifies the user is an active
        member, and confirms the branch membership is also active.
      properties:
        branch_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - branch_id
      - end_time
      - start_time
      - user_id
      - weekday
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
