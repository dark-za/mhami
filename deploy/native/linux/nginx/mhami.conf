server {
    listen 80;
    server_name mhami.example.com;
    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/mhami-certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mhami.example.com;

    ssl_certificate /etc/letsencrypt/live/mhami.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhami.example.com/privkey.pem;
    root /var/lib/mhami/frontend;
    index index.html;
    client_max_body_size 12m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
