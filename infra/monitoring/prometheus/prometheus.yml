# Prometheus configuration for the modular operations platform.
#
# INFRA-04: scrape the platform API metrics endpoint, the blackbox
# exporter for liveness/TCP probes, and the postgresql / redis exporters
# when they are deployed. Alert rules live in ``alerts/*.yml`` and are
# loaded by Prometheus. Replace ``$METRICS_TOKEN`` and ``$METRICS_ENDPOINT``
# at deploy time with the production values from the secret store.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: mhami-platform
    environment: production

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: platform-api
    scheme: http
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
    authorization:
      type: X-Metrics-Token
      credentials_file: /etc/prometheus/metrics_token

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx, tcp_connect]
    static_configs:
      - targets:
          - http://api:8000/api/health/live
          - tcp://db:5432
          - tcp://redis:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - target_label: job
        replacement: platform

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
