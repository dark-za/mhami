# INFRA-04: Celery queue and worker alerts.
#
# Uses the platform's own ``/api/v1/metrics`` signals (``platform_celery_*``),
# which do not require a separate Celery exporter.

groups:
  - name: platform-celery
    rules:
      - alert: PlatformCeleryWorkersDown
        expr: platform_celery_workers{job="platform-api"} < 1
        for: 5m
        labels:
          severity: critical
          service: celery
        annotations:
          summary: No Celery workers responding
          description: "No worker has reported a healthy ping for 5 minutes."

      - alert: PlatformCeleryQueueBacklog
        expr: platform_celery_queue_depth{job="platform-api"} > 100
        for: 10m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: Celery queue backlog growing
          description: "Queue {{ $labels.queue }} has more than 100 pending tasks for 10 minutes."
