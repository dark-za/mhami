# INFRA-04: Backup freshness + media capacity alerts.
#
# All rules use metrics emitted by the platform's own ``/api/v1/metrics``
# endpoint (``platform_backup_*``, ``platform_media_*``).

groups:
  - name: platform-backups
    rules:
      - alert: PlatformBackupStale
        expr: |
          platform_backup_last_success_timestamp_seconds{job="platform-api"} == 0
          or (
            time() - platform_backup_last_success_timestamp_seconds{job="platform-api"} > 93600
          )
        for: 15m
        labels:
          severity: critical
          service: backups
        annotations:
          summary: Local backup is outside the RPO window
          description: "No local backup has succeeded within 26 hours (or no backup has ever succeeded)."

      - alert: PlatformBackupFailure
        expr: |
          platform_backup_last_failure_timestamp_seconds{job="platform-api"} > 0
          and platform_backup_last_failure_timestamp_seconds{job="platform-api"}
            > platform_backup_last_success_timestamp_seconds{job="platform-api"}
        for: 15m
        labels:
          severity: critical
          service: backups
        annotations:
          summary: Latest backup attempt failed
          description: "The most recent backup attempt is newer than the last success."

  - name: platform-media
    rules:
      - alert: PlatformMediaDiskSpaceLow
        expr: |
          platform_media_disk_size_bytes{job="platform-api"} > 0
          and (
            platform_media_disk_free_bytes{job="platform-api"}
            / platform_media_disk_size_bytes{job="platform-api"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
          service: media
        annotations:
          summary: Media disk space is low
          description: Less than 15% of the media volume is available.
