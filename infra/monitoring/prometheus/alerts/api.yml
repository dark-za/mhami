# INFRA-04: API and blackbox health alerts. Imported by ``prometheus/prometheus.yml``.

groups:
  - name: platform-api
    rules:
      - alert: PlatformApiLiveness
        expr: probe_success{job="platform", target="http://api:8000/api/health/live"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Platform API liveness probe failing
          description: "The API liveness probe ({{ $labels.target }}) has not returned HTTP 200 for 2 minutes."

      - alert: PlatformApiHealthCheckFailing
        expr: probe_success{job="platform", target=~".*api/health.*"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Platform API health probe failing
          description: "The blackbox probe for {{ $labels.target }} has not returned success for 2 minutes."
