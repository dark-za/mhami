# INFRA-04: API alerts. Imported by the main ``prometheus.yml``.

groups:
  - name: platform-api
    rules:
      - alert: PlatformApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="platform-api",status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="platform-api"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Platform API 5xx error rate exceeded 5%
          description: "More than 5% of API requests returned a 5xx status in the last 5 minutes."

      - alert: PlatformApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="platform-api"}[5m]))
          ) > 1.5
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: Platform API p95 latency above 1.5s
          description: "The 95th-percentile request duration exceeded 1.5 seconds for 10 minutes."

      - alert: PlatformApiHealthCheckFailing
        expr: probe_success{job="platform", target=~".*api/health.*"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Platform API health probe failing
          description: "The blackbox probe for {{ $labels.target }} has not returned success for 2 minutes."
