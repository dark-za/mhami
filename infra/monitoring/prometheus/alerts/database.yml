# INFRA-04: PostgreSQL and Redis availability alerts.
#
# ``pg_*`` rules require a PostgreSQL exporter scraped as ``job="platform-postgres"``
# (optional; not bundled by compose.monitoring.yml). They stay silent until
# that exporter is deployed. Blackbox TCP probes and the API's own
# ``platform_database_up`` / ``platform_redis_up`` metrics cover core
# availability without an exporter.

groups:
  - name: platform-database
    rules:
      - alert: PlatformPostgresDown
        expr: probe_success{job="platform", target=~".*db:5432"} == 0
        for: 2m
        labels:
          severity: critical
          service: db
        annotations:
          summary: Platform PostgreSQL is unreachable
          description: "Postgres on {{ $labels.target }} has not accepted a TCP connection for 2 minutes."

      - alert: PlatformDatabaseHealthDegraded
        expr: platform_database_up{job="platform-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: db
        annotations:
          summary: Platform database health check failed
          description: The API cannot establish a database connection.

      - alert: PlatformPostgresConnectionsHigh
        expr: |
          pg_stat_activity_count{job="platform-postgres"}
            / pg_settings_max_connections{job="platform-postgres"} > 0.8
        for: 10m
        labels:
          severity: warning
          service: db
        annotations:
          summary: Postgres connections above 80% of max
          description: "Active connections exceeded 80% of the configured maximum for 10 minutes."

      - alert: PlatformPostgresReplicationLag
        expr: pg_replication_lag_seconds{job="platform-postgres"} > 30
        for: 5m
        labels:
          severity: warning
          service: db
        annotations:
          summary: Postgres replica lag above 30s
          description: "Replica {{ $labels.instance }} is more than 30 seconds behind primary."

      - alert: PlatformPostgresLongRunningTx
        expr: pg_stat_activity_max_tx_duration_seconds{job="platform-postgres"} > 600
        for: 5m
        labels:
          severity: warning
          service: db
        annotations:
          summary: Long-running Postgres transaction detected
          description: "A transaction has been open for more than 10 minutes."

  - name: platform-redis
    rules:
      - alert: PlatformRedisDown
        expr: probe_success{job="platform", target="tcp://redis:6379"} == 0
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Platform Redis is unreachable
          description: "Redis ({{ $labels.target }}) has not accepted a TCP connection for 2 minutes."

      - alert: PlatformRedisHealthDegraded
        expr: platform_redis_up{job="platform-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Platform Redis health check failed
          description: The API cannot reach the Redis broker.
