# ZAP configuration notes
#
# The ZAP baseline scan is run weekly via .github/workflows/zap-baseline.yml.
# The full scan runs on Sundays at 03:00 UTC via zap-full.yml.
#
# Both jobs post the HTML report as a workflow artefact. Build fails
# on any high-risk finding unless a documented exception lives in
# docs/SECURITY_EXCEPTIONS.md and the alert ID is suppressed in
# .zap/rules.tsv.
#
# Dependency-audit (pip-audit) runs in the main ci.yml job. Bandit
# and Safety are wired through the `[project.optional-dependencies].dev`
# section of backend/pyproject.toml.
