# ---- INFRA-01: Backend hardening baseline -------------------------------
# ``x-backend-defaults`` carries every security knob that the ``api``,
# ``worker`` and ``beat`` services share. Override files can pull it in via
# the merge key without redefining the same anchors.
x-backend-defaults: &backend_defaults
  build:
    context: ./backend
  user: "1000:1000"
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  security_opt:
    - no-new-privileges:true
  pids_limit: 100
  mem_limit: 512m
  cpus: 1.0
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/live"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:-}
    # INFRA-01: AUDIT_HMAC_SECRET is mandatory in every environment so the
    # audit chain is never computed with a default value, even in dev. The
    # prod override below enforces the same variable with the fail-fast
    # syntax to ensure the value is non-empty when DJANGO_DEBUG=false.
    AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?Set AUDIT_HMAC_SECRET in .env}
    POSTGRES_DB: ${POSTGRES_DB:-platform}
    POSTGRES_USER: ${POSTGRES_USER:-platform}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    POSTGRES_HOST: ${POSTGRES_HOST:-db}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    CACHE_URL: ${CACHE_URL:-redis://redis:6379/2}

services:
  db:
    image: postgres:17.11
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Backend shared defaults ------------------------------------------
  # Inherits every security knob from ``x-backend-defaults``; the
  # ``depends_on`` block is the only override that needs to live on the
  # service directly because it must reference db/redis by name.
  api:
    <<: *backend_defaults
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
    user: "101:101"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
  redis-data:
  media-data:
  frontend-node-modules:
